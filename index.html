    <!-- Adaptive motion tier before first paint (see src/utils/motionTier.js) -->
    <script>
      (function () {
        var d = document.documentElement, n = navigator, c = n.connection || {}, t = 'full';
        try {
          if (matchMedia('(prefers-reduced-motion: reduce)').matches) t = 'off';
          else {
            var mem = n.deviceMemory, touch = matchMedia('(pointer: coarse)').matches;
            if (c.saveData || /2g|3g/.test(c.effectiveType || '') || (mem && mem <= (touch ? 4 : 2)) || (n.hardwareConcurrency && n.hardwareConcurrency <= 2)) t = 'lite';
          }
          if (t === 'full' && sessionStorage.getItem('sw_motion') === 'lite') t = 'lite';
        } catch (e) {}
        d.setAttribute('data-motion', t);
      })();
    </script>

    <!-- Critical CSS for instant above-the-fold paint (render-blocking replaced at build) -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; scroll-behavior: smooth; overflow-x: hidden; }
      body { background-color: #0A0A0A; color: #FFFFFF; font-family: 'Inter', system-ui, -apple-system, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
      body.cursor-none { cursor: none; }
      h1, h2, h3, h4, h5, h6 { word-break: break-word; overflow-wrap: break-word; hyphens: auto; }
      ::-webkit-scrollbar { width: 3px; }
      ::-webkit-scrollbar-track { background: #0A0A0A; }
      ::-webkit-scrollbar-thumb { background: #D97706; border-radius: 2px; }
      ::selection { background: #D97706; color: #0A0A0A; }
      @keyframes slideDown { from { transform: translateY(-100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .animate-slideDown { animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
      @keyframes modalIn { from { opacity: 0; transform: translateY(60px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .animate-modalIn { animation: modalIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
      @keyframes heroIn { from { transform: translateY(10px); } to { transform: translateY(0); } }
      .animate-heroIn { animation: heroIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .text-white { color: #FFFFFF; }
      .text-gold-500 { color: #D97706; }
      .text-gold-gradient { background: linear-gradient(135deg, #FCD34D, #D97706, #B45309); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
      /* While a prerendered page body (not the home hero) is on screen, keep the React root out of
         layout; it appears in place once the page releases the static copy (useReleaseStaticBody). */
      #hero-host:not([hidden]):not(:has([data-static-hero])) + #root { display: none; }
      /*hero-css*/
    </style>

    <!-- Speculation Rules API: instant next-page navigations (progressive enhancement) -->
    <script type="speculationrules">
    {
      "prerender": [{
        "where": { "href_matches": "/*" },
        "eagerness": "moderate"
      }]
    }
    </script>

    <!-- Defer Google Analytics to first user interaction (avoids 490ms main-thread blocking) -->
    <script>
      if (!document.prerendering) {
        var _ga = function() {
          _ga = function(){};
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-MNVQN1HEK9');
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-MNVQN1HEK9';
          document.head.appendChild(s);
        };
        var _events = ['keydown', 'mousedown', 'touchstart', 'scroll'];
        function _onFirstInteraction() {
          _events.forEach(function(e) { document.removeEventListener(e, _onFirstInteraction, {passive:true, once:true}); });
          _ga();
        }
        _events.forEach(function(e) { document.addEventListener(e, _onFirstInteraction, {passive: true, once: true}); });
      }
    </script>
