name: Daily Blog Post Creator

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run blog post creator
        run: node scripts/create-post.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain public/data/blog-posts.json)" ]; then
            git config user.name "SenninWeb Bot"
            git config user.email "bot@senninweb.com"
            git add public/data/blog-posts.json
            LAST_SLUG=$(git diff --cached -- public/data/blog-posts.json | grep '"slug"' | head -1 | sed 's/.*"slug": "\(.*\)",/\1/')
            git commit -m "feat(blog): add ${LAST_SLUG:-daily-post}"
            git push
            echo "Posted: ${LAST_SLUG:-daily-post}"
          else
            echo "No changes to commit"
          fi
